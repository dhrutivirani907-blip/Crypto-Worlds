```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#0b0b12">

    <title>Watch Ads</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;

        .app {

        }

        .title {

        .subtitle {

                0 20px 60px rgba(0, 0, 0, 0.35),

</head>

<body>

    <main class="app">

        <div class="logo">
            ▶
        </div>

        <h1 class="title">Watch Ads</h1>

        <p class="subtitle">
            Watch ads and increase your total count
        </p>

        <section class="count-card">

            <div class="count-label">
                Total Ads Watched
            </div>

            <div id="adsCount" class="count">
                0
            </div>

            <div class="count-text">
                Keep watching to increase your count
            </div>

        </section>

        <button
            id="watchButton"
            class="watch-button"
            onclick="watchAd()"
        >
            ▶ WATCH ADS
        </button>

        <div id="status" class="status"></div>

        <p class="info">
            Tap the button to watch an advertisement.<br>
            Your count is saved automatically.
        </p>

        <div class="footer">
            Simple Ads App
        </div>

    </main>

    <script>

        // ==========================================
        // MONETAG DIRECT LINK
        // ==========================================

        const MONETAG_LINK = "https://omg10.com/4/11862822";


        // ==========================================
        // STORAGE KEY
        // ==========================================

        const STORAGE_KEY = "total_ads_watched";


        // ==========================================
        // GET CURRENT COUNT
        // ==========================================

        function getAdsCount() {

            const savedCount = localStorage.getItem(STORAGE_KEY);

            if (savedCount === null) {
                return 0;
            }

            const count = parseInt(savedCount, 10);

            return Number.isFinite(count) ? count : 0;
        }


        // ==========================================
        // DISPLAY COUNT
        // ==========================================

        function updateCount() {

            const count = getAdsCount();

            document.getElementById("adsCount").textContent =
                count.toLocaleString();

        }


        // ==========================================
        // SAVE COUNT
        // ==========================================

        function saveAdsCount(count) {

            localStorage.setItem(
                STORAGE_KEY,
                String(count)
            );

        }


        // ==========================================
        // WATCH ADS
        // ==========================================

        function watchAd() {

            const button =
                document.getElementById("watchButton");

            const status =
                document.getElementById("status");


            // Prevent multiple clicks
            button.disabled = true;

            button.textContent = "OPENING AD...";

            status.textContent = "Advertisement opened...";


            /*
             * We store a pending flag before leaving
             * the page.
             */

            sessionStorage.setItem(
                "ad_pending",
                "1"
            );


            /*
             * Open Monetag direct link.
             */

            window.location.href = MONETAG_LINK;

        }


        // ==========================================
        // CHECK RETURN FROM AD
        // ==========================================

        function checkAdReturn() {

            const pending =
                sessionStorage.getItem("ad_pending");


            if (pending === "1") {

                /*
                 * Remove pending flag so one return
                 * only counts once.
                 */

                sessionStorage.removeItem(
                    "ad_pending"
                );


                /*
                 * Increase count.
                 */

                const currentCount =
                    getAdsCount();

                const newCount =
                    currentCount + 1;


                saveAdsCount(newCount);

                updateCount();


                /*
                 * Show success message.
                 */

                document.getElementById("status").textContent =
                    "✓ Ad counted successfully!";


                /*
                 * Small visual feedback.
                 */

                const countElement =
                    document.getElementById("adsCount");

                countElement.animate(
                    [
                        {
                            transform: "scale(1)"
                        },
                        {
                            transform: "scale(1.18)"
                        },
                        {
                            transform: "scale(1)"
                        }
                    ],
                    {
                        duration: 400,
                        easing: "ease-out"
                    }
                );

            }

        }


        // ==========================================
        // APP START
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                updateCount();

                checkAdReturn();

            }
        );


        // ==========================================
        // HANDLE RETURN / APP RESUME
        // ==========================================

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState === "visible"
                ) {

                    checkAdReturn();

                }

            }
        );

    </script>

</body>
</html>
