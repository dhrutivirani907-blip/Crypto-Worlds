
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#09090f">

    <title>Crypto Worlds</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #27204d 0%,
                    #11101b 38%,
                    #07070b 75%,
                    #040406 100%
                );

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            overflow-x: hidden;
        }

        .app {

            width: 100%;
            max-width: 430px;

            min-height: 620px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            width: 82px;
            height: 82px;

            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7,
                    #c084fc
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
            font-weight: 900;

            box-shadow:
                0 18px 50px rgba(124, 58, 237, 0.40);

            margin-bottom: 20px;
        }


        /* =========================
           TITLE
        ========================= */

        .title {

            font-size: 29px;
            font-weight: 900;

            letter-spacing: -0.5px;

            margin-bottom: 7px;
        }

        .subtitle {

            font-size: 14px;

            color: #9d9aaa;

            text-align: center;

            margin-bottom: 30px;
        }


        /* =========================
           COUNT CARD
        ========================= */

        .count-card {

            width: 100%;

            padding: 36px 20px;

            border-radius: 27px;

            background:
                rgba(255, 255, 255, 0.065);

            border:
                1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            text-align: center;
        }

        .count-label {

            font-size: 13px;

            color: #aaa7b8;

            text-transform: uppercase;

            letter-spacing: 1.7px;

            margin-bottom: 14px;
        }

        .count {

            font-size: 68px;

            line-height: 1;

            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #c4b5fd
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .count-description {

            margin-top: 13px;

            font-size: 12px;

            color: #777486;
        }


        /* =========================
           WATCH BUTTON
        ========================= */

        .watch-button {

            width: 100%;

            height: 62px;

            margin-top: 22px;

            border: none;

            border-radius: 19px;

            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #8b5cf6,
                    #a855f7
                );

            color: #ffffff;

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 0.4px;

            cursor: pointer;

            box-shadow:
                0 16px 38px rgba(124, 58, 237, 0.36);

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .watch-button:active {

            transform: scale(0.97);
        }

        .watch-button:disabled {

            opacity: 0.55;

            cursor: not-allowed;
        }


        /* =========================
           STATUS
        ========================= */

        .status {

            min-height: 21px;

            margin-top: 14px;

            font-size: 13px;

            color: #a78bfa;

            text-align: center;
        }


        /* =========================
           INFO
        ========================= */

        .info {

            margin-top: 18px;

            color: #777486;

            font-size: 12px;

            line-height: 1.65;

            text-align: center;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: 30px;

            color: #4e4c58;

            font-size: 11px;

            text-align: center;
        }


        /* =========================
           SUCCESS ANIMATION
        ========================= */

        .success {

            animation:
                successPulse 0.45s ease;
        }

        @keyframes successPulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.16);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-height: 680px) {

            .app {
                min-height: auto;
            }

            .logo {

                width: 65px;
                height: 65px;

                border-radius: 21px;

                font-size: 28px;

                margin-bottom: 14px;
            }

            .title {
                font-size: 25px;
            }

            .subtitle {
                margin-bottom: 20px;
            }

            .count-card {
                padding: 27px 20px;
            }

            .count {
                font-size: 55px;
            }

            .watch-button {
                height: 56px;
            }
        }

    </style>

</head>


<body>

    <main class="app">


        <!-- LOGO -->

        <div class="logo">
            ₿
        </div>


        <!-- TITLE -->

        <h1 class="title">
            Crypto Worlds
        </h1>


        <p class="subtitle">
            Watch ads and increase your total count
        </p>


        <!-- COUNT -->

        <section class="count-card">

            <div class="count-label">
                Total Ads Watched
            </div>

            <div
                id="adsCount"
                class="count"
            >
                0
            </div>

            <div class="count-description">
                Your total advertisement count
            </div>

        </section>


        <!-- WATCH BUTTON -->

        <button
            id="watchButton"
            class="watch-button"
            type="button"
        >
            ▶ WATCH ADS
        </button>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
        ></div>


        <!-- INFO -->

        <p class="info">
            Tap the button to open the advertisement.<br>
            Return to Crypto Worlds after viewing the ad.
        </p>


        <!-- FOOTER -->

        <div class="footer">
            Crypto Worlds • Ads
        </div>


    </main>


    <script>

        /* ==================================================
           CONFIGURATION
        ================================================== */

        const MONETAG_LINK =
            "https://omg10.com/4/11862822";


        const STORAGE_KEY =
            "crypto_worlds_total_ads";


        const PENDING_KEY =
            "crypto_worlds_ad_pending";


        /* ==================================================
           TELEGRAM
        ================================================== */

        const isTelegram =
            Boolean(
                window.Telegram &&
                window.Telegram.WebApp
            );


        if (isTelegram) {

            try {

                Telegram.WebApp.ready();

                Telegram.WebApp.expand();

            } catch (error) {

                console.log(
                    "Telegram initialization error:",
                    error
                );

            }

        }


        /* ==================================================
           GET COUNT
        ================================================== */

        function getCount() {

            const value =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (value === null) {
                return 0;
            }

            const number =
                parseInt(value, 10);

            if (
                Number.isNaN(number) ||
                number < 0
            ) {

                return 0;

            }

            return number;

        }


        /* ==================================================
           SAVE COUNT
        ================================================== */

        function saveCount(count) {

            localStorage.setItem(
                STORAGE_KEY,
                String(count)
            );

        }


        /* ==================================================
           UPDATE UI
        ================================================== */

        function updateCount() {

            const count =
                getCount();

            document.getElementById(
                "adsCount"
            ).textContent =
                count.toLocaleString();

        }


        /* ==================================================
           STATUS
        ================================================== */

        function setStatus(message) {

            document.getElementById(
                "status"
            ).textContent =
                message;

        }


        /* ==================================================
           COUNT AD
        ================================================== */

        function countAd() {

            const current =
                getCount();

            const newCount =
                current + 1;

            saveCount(newCount);

            updateCount();


            const countElement =
                document.getElementById(
                    "adsCount"
                );


            countElement.classList.remove(
                "success"
            );


            /*
             * Force browser to restart animation.
             */

            void countElement.offsetWidth;


            countElement.classList.add(
                "success"
            );


            setStatus(
                "✓ Ad counted successfully!"
            );

        }


        /* ==================================================
           OPEN MONETAG
           
           IMPORTANT:
           Telegram.WebApp.openLink()
           opens the URL using Telegram's
           external-browser link mechanism.
        ================================================== */

        function openMonetagAd() {

            /*
             * Save pending state BEFORE opening
             * the advertisement.
             */

            sessionStorage.setItem(
                PENDING_KEY,
                "1"
            );


            setStatus(
                "Opening advertisement..."
            );


            /*
             * Telegram Mini App
             */

            if (
                window.Telegram &&
                window.Telegram.WebApp
            ) {

                try {

                    Telegram.WebApp.openLink(
                        MONETAG_LINK,
                        {
                            try_instant_view: false
                        }
                    );

                    return;

                } catch (error) {

                    console.log(
                        "Telegram openLink failed:",
                        error
                    );

                }

            }


            /*
             * Normal browser fallback.
             */

            window.open(
                MONETAG_LINK,
                "_blank",
                "noopener,noreferrer"
            );

        }


        /* ==================================================
           WATCH BUTTON
        ================================================== */

        let openingAd = false;


        function watchAd() {

            /*
             * Prevent accidental double clicks.
             */

            if (openingAd) {
                return;
            }


            openingAd = true;


            const button =
                document.getElementById(
                    "watchButton"
                );


            button.disabled = true;

            button.textContent =
                "OPENING AD...";


            openMonetagAd();


            /*
             * Re-enable after a short time.
             */

            setTimeout(
                function () {

                    openingAd = false;

                    button.disabled = false;

                    button.textContent =
                        "▶ WATCH ADS";

                },
                2500
            );

        }


        /* ==================================================
           BUTTON EVENT
        ================================================== */

        document
            .getElementById("watchButton")
            .addEventListener(
                "click",
                watchAd
            );


        /* ==================================================
           RETURN CHECK
        ================================================== */

        function checkAdReturn() {

            const pending =
                sessionStorage.getItem(
                    PENDING_KEY
                );


            if (pending !== "1") {
                return;
            }


            /*
             * Remove FIRST.
             *
             * This prevents the same ad from
             * being counted repeatedly.
             */

            sessionStorage.removeItem(
                PENDING_KEY
            );


            /*
             * Count the completed return.
             */

            countAd();

        }


        /* ==================================================
           PAGE LOAD
        ================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                updateCount();

                checkAdReturn();

            }
        );


        /* ==================================================
           APP RETURN / VISIBILITY
        ================================================== */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    /*
                     * Give the browser a moment
                     * to finish returning.
                     */

                    setTimeout(
                        checkAdReturn,
                        500
                    );

                }

            }
        );


        /* ==================================================
           PAGE FOCUS
        ================================================== */

        window.addEventListener(
            "focus",
            function () {

                setTimeout(
                    checkAdReturn,
                    500
                );

            }
        );


        /* ==================================================
           INITIAL UI
        ================================================== */

        updateCount();

    </script>

</body>

</html>
